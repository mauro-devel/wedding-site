<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ana & Mauricio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&amp;family=Montserrat:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <a href="{{ url_for('main.index') }}">{{ _('Home') }}</a>
        <a href="{{ url_for('main.rsvp') }}">{{ _('RSVP') }}</a>
        |
        <a href="{{ url_for('main.set_language', lang='es') }}" 
           {% if get_locale() == 'es' %}style="font-weight: bold; color: #d4af37;"{% endif %}>
            Español
        </a>
        <a href="{{ url_for('main.set_language', lang='pt_PT') }}"
           {% if get_locale() == 'pt_PT' %}style="font-weight: bold; color: #d4af37;"{% endif %}>
            Português
        </a>
    </nav>
    
    <main>
        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="flash flash-{{ category }}">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <p>&copy; 2026 Ana & Mauricio</p>
    </footer>
</body>
</html>
